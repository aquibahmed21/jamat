<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6b4f">
  <!-- Everything is same-origin: no inline script/style, no third-party loads, no plugins, no outside form posts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title></title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div class="app">
    <header class="topbar"><h1 id="app-title" class="brand"></h1><span id="net" class="net" hidden></span><div id="lang" class="lang"></div></header>
    <div id="banner" class="banner" role="status" hidden></div>
    <div id="toast" class="toast-region" role="status" aria-live="polite"></div>
    <nav id="nav" class="nav"></nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
